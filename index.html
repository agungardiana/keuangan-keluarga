*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.app{min-height:100vh}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0f766e,#2563eb)}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 12px 35px #0002}.auth .card{width:min(430px,100%)}h1,h2,h3,p{margin-top:0}.brand{font-weight:800;font-size:24px}.muted{color:#6b7280}.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:700;color:#475569}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dbe2ea;border-radius:10px;background:#fff}.btn{padding:11px 15px;border-radius:10px;font-weight:700}.primary{background:#2563eb;color:white}.success{background:#059669;color:white}.danger{background:#dc2626;color:white}.ghost{background:#eef2f7;color:#334155}.link{background:none;color:#2563eb;padding:0}.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tabs button{white-space:nowrap;padding:10px 14px;border-radius:10px;background:#e8edf5;color:#475569;font-weight:700}.tabs button.active{background:#2563eb;color:white}.layout{display:flex;min-height:100vh}.side{width:235px;background:#0f172a;color:white;padding:22px 15px;position:fixed;inset:0 auto 0 0}.side .brand{margin:5px 8px 28px}.nav{display:grid;gap:6px}.nav button{padding:11px 12px;text-align:left;background:transparent;color:#cbd5e1;border-radius:9px}.nav button.active,.nav button:hover{background:#1e293b;color:white}.main{margin-left:235px;width:calc(100% - 235px);padding:25px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.userbox{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;color:#1d4ed8;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.profile-card{display:flex;align-items:center;gap:18px;padding:18px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:20px}.profile-avatar-lg{width:92px;height:92px;border-radius:50%;background:#dbeafe;display:grid;place-items:center;color:#1d4ed8;font-size:32px;font-weight:800;overflow:hidden;flex:none}.profile-avatar-lg img{width:100%;height:100%;object-fit:cover}.profile-actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px #1720330b}.stat .label{color:#64748b;font-size:13px}.stat .value{font-size:24px;font-weight:800;margin-top:7px}.content{margin-top:15px;display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.section{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 16px #1720330b}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 7px;border-bottom:1px solid #eef2f7;text-align:left;font-size:14px}.income{color:#059669;font-weight:700}.expense{color:#dc2626;font-weight:700}.empty{text-align:center;padding:35px;color:#94a3b8}.modal{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:20px;z-index:10}.modal .card{width:min(520px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;padding:12px 16px;background:#111827;color:#fff;border-radius:10px;z-index:20}.login-error-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px) scale(.72);opacity:0;visibility:hidden;display:flex;align-items:center;gap:10px;min-width:min(360px,calc(100vw - 32px));justify-content:center;padding:13px 18px;background:#dc2626;color:#fff;border-radius:14px;box-shadow:0 12px 30px #0004;font-weight:700;text-align:center;z-index:1000;pointer-events:none}.login-error-toast.show{visibility:visible;animation:loginPopupIn .35s cubic-bezier(.22,1,.36,1) forwards}.login-error-toast.hide{visibility:visible;animation:loginPopupOut .3s ease-in forwards}@keyframes loginPopupIn{0%{opacity:0;transform:translate(-50%,35px) scale(.72)}70%{opacity:1;transform:translate(-50%,-4px) scale(1.04)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}@keyframes loginPopupOut{0%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,12px) scale(.72)}}.member{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.badge{padding:4px 8px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:12px;font-weight:700}.code{font-size:24px;font-weight:900;letter-spacing:4px}.chartbar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.chartbar span{display:block;height:100%;background:#2563eb}.mobilebar{display:none}.mobile-logout{display:none}
/* Responsive layout: cegah overflow dan teks terpotong di HP */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{min-width:0}
.main,.section,.card,.top,.userbox,.profile-card,.profile-card>div,.row,.field{min-width:0}
.top h1{overflow-wrap:anywhere}
.userbox{max-width:100%}
.userbox>div{min-width:0}
.userbox .muted,.profile-card .muted{overflow-wrap:anywhere;word-break:break-word}
.profile-card b{overflow-wrap:anywhere}
input,select{max-width:100%}

@media(max-width:900px){
  .mobile-logout{display:inline-block;padding:8px 10px;font-size:12px;flex:none}
  .side{display:none}
  .main{margin:0;width:100%;max-width:100%;padding:16px 16px 88px;overflow:hidden}
  .top{align-items:flex-start;gap:10px}
  .top>div:first-child{min-width:0;flex:1}
  .top h1{font-size:clamp(28px,8vw,40px);line-height:1.08;margin-bottom:8px}
  .top .userbox{flex:0 1 auto;justify-content:flex-end;gap:7px}
  .top .userbox>div:nth-child(2){max-width:110px}
  .top .avatar{width:40px;height:40px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .content{grid-template-columns:1fr}
  .section{width:100%;overflow:hidden}
  .row{align-items:flex-start;flex-wrap:wrap}
  .row>h3,.row>div:first-child{min-width:0}
  .actions{min-width:0}
  .mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0f172a;padding:8px 6px;z-index:5;gap:4px}
  .mobilebar button{flex:1;min-width:0;background:transparent;color:#cbd5e1;padding:9px 2px;border-radius:8px;font-size:12px;line-height:1.25;white-space:nowrap}
  .mobilebar button.active{background:#1e293b;color:white}

}

@media(max-width:600px){
  .main{padding-left:12px;padding-right:12px}

  .top>div:first-child{flex:1 1 150px}

  .top .userbox>div:nth-child(2){max-width:none}
  .section{padding:15px}
  .profile-card{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:14px}
  .profile-avatar-lg{width:72px;height:72px;font-size:26px}
  .profile-actions{gap:7px}
  .profile-actions .btn{font-size:14px;padding:10px 12px}
  .grid{gap:10px}
  .stat{padding:13px}
  .stat .value{font-size:18px;overflow-wrap:anywhere}
  .table{min-width:520px}
  .table th,.table td{font-size:13px;padding:9px 6px}
  .mobilebar button{font-size:11px}
}

@media(max-width:380px){
  .top .userbox>div:nth-child(2){display:none}
  .mobilebar button{font-size:10px}
  .mobilebar{padding-left:3px;padding-right:3px}
  .section{padding:13px}
  .profile-card{grid-template-columns:62px minmax(0,1fr)}
  .profile-avatar-lg{width:62px;height:62px}
}

<body>
<div id="toast" class="toast hidden"></div><div id="loginErrorToast" class="login-error-toast" role="alert" aria-live="assertive"></div>
<div id="auth" class="auth"><div class="card">
  <div class="brand">💰 Keuangan Keluarga</div><p class="muted" style="margin-top:8px">Kelola keuangan keluarga dari HP, tablet, dan PC.</p>
  <div id="loginForm"><h2>Masuk</h2><div class="form"><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button class="btn primary" onclick="login()">Masuk</button></div><p style="margin-top:15px">Belum punya akun? <button class="link" onclick="showAuth('register')">Daftar</button></p></div>
  <div id="registerForm" class="hidden"><h2>Daftar akun</h2><div class="form"><div class="field"><label>Nama</label><input id="regName"></div><div class="field"><label>Email</label><input id="regEmail" type="email"></div><div class="field"><label>Password</label><input id="regPassword" type="password" minlength="6"></div><button class="btn primary" onclick="register()">Buat akun</button></div><p style="margin-top:15px">Sudah punya akun? <button class="link" onclick="showAuth('login')">Masuk</button></p></div>
</div></div>
<div id="setup" class="auth hidden"><div class="card"><div class="brand">Siapkan keluarga</div><p class="muted">Buat keluarga baru atau bergabung dengan keluarga yang sudah ada.</p><div class="tabs"><button id="tabCreate" class="active" onclick="setupTab('create')">Buat keluarga</button><button id="tabJoin" onclick="setupTab('join')">Gabung</button></div><div id="createBox"><div class="field"><label>Nama keluarga</label><input id="familyName" placeholder="Keluarga Agung"></div><button class="btn primary" style="margin-top:12px" onclick="createFamily()">Buat keluarga</button></div><div id="joinBox" class="hidden"><div class="field"><label>Kode keluarga</label><input id="familyCode" placeholder="6 karakter" maxlength="8"></div><button class="btn success" style="margin-top:12px" onclick="joinFamily()">Gabung keluarga</button></div><button class="btn ghost" style="margin-top:12px;width:100%" onclick="logout()">Keluar</button></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">💰 Keuangan</div><div id="sideFamily" class="muted" style="margin:0 8px 18px"></div><div class="nav"><button data-page="dashboard" onclick="go('dashboard')">📊 Dashboard</button><button data-page="transactions" onclick="go('transactions')">💳 Transaksi</button><button data-page="budgets" onclick="go('budgets')">🎯 Anggaran</button><button data-page="savings" onclick="go('savings')">🏦 Tabungan</button><button data-page="reports" onclick="go('reports')">📈 Laporan</button><button data-page="members" onclick="go('members')">👨‍👩‍👧 Anggota</button><button data-page="settings" onclick="go('settings')">⚙️ Pengaturan</button></div><button class="btn ghost" style="width:100%;margin-top:30px" onclick="logout()">Keluar</button></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="today"></div></div><div class="userbox"><button class="btn danger mobile-logout" onclick="logout()">🚪 Keluar</button><div><b id="userName"></b><div class="muted" style="font-size:12px" id="familyLabel"></div></div><div class="avatar" id="avatar">A</div></div></div><div id="page"></div></main><div class="mobilebar"><button data-page="dashboard" onclick="go('dashboard')">📊<br>Home</button><button data-page="transactions" onclick="go('transactions')">💳<br>Transaksi</button><button data-page="budgets" onclick="go('budgets')">🎯<br>Anggaran</button><button data-page="reports" onclick="go('reports')">📈<br>Laporan</button><button data-page="settings" onclick="go('settings')">⚙️<br>Akun</button><button onclick="logout()">🚪<br>Keluar</button></div></div>
<div id="modal" class="modal hidden"><div class="card"><div class="row"><h2 id="modalTitle">Tambah</h2><button class="btn ghost" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://jqjjbunlkeufdvfaewbu.supabase.co'; const SUPABASE_ANON_KEY='sb_publishable_yu36iMyNyMcDJkWZRtOBgA_mRntse4q';
let sb=null,user=null,profile=null,membership=null,family=null,categories=[],transactions=[],budgets=[],goals=[]; let page='dashboard';
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function showAuth(x){document.getElementById('loginForm').classList.toggle('hidden',x!=='login');document.getElementById('registerForm').classList.toggle('hidden',x!=='register')}
function setupTab(x){document.getElementById('createBox').classList.toggle('hidden',x!=='create');document.getElementById('joinBox').classList.toggle('hidden',x!=='join');document.getElementById('tabCreate').classList.toggle('active',x==='create');document.getElementById('tabJoin').classList.toggle('active',x==='join')}
async function init(){document.getElementById('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(!SUPABASE_URL||!SUPABASE_ANON_KEY){toast('Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file index.html');return}sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await sb.auth.getSession();if(data.session) await boot(data.session.user);sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_IN'&&s) await boot(s.user);if(e==='SIGNED_OUT') location.reload()})}
async function register(){const name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim(),password=document.getElementById('regPassword').value;if(!name||!email||password.length<6)return toast('Lengkapi data. Password minimal 6 karakter.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return toast(error.message);if(!data.session)toast('Akun dibuat. Cek email untuk verifikasi, lalu masuk.');else await boot(data.user)}
let loginErrorTimer=null;function showLoginError(message='Email atau password salah'){const t=document.getElementById('loginErrorToast');if(!t)return;t.textContent=message;t.classList.remove('hide','show');void t.offsetWidth;t.classList.add('show');clearTimeout(loginErrorTimer);loginErrorTimer=setTimeout(()=>{t.classList.remove('show');t.classList.add('hide');setTimeout(()=>t.classList.remove('hide'),300)},2800)}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password)return showLoginError('Email dan password wajib diisi');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return showLoginError('Email atau password salah');await boot(data.user)}
async function logout(){if(sb)await sb.auth.signOut()}
async function boot(u){user=u;document.getElementById('auth').classList.add('hidden');const {data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error){toast('Gagal membaca profil: '+error.message);return}profile=p;if(p?.avatar_url){user={...user,user_metadata:{...(user.user_metadata||{}),avatar_url:p.avatar_url}}}await loadMembership();}
async function loadMembership(){const {data,error}=await sb.from('family_members').select('*,families(*)').eq('user_id',user.id).maybeSingle();if(error){toast(error.message);return}if(!data){document.getElementById('setup').classList.remove('hidden');return}membership=data;family=data.families;document.getElementById('setup').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=profile.full_name||user.email;setHeaderAvatar();document.getElementById('familyLabel').textContent=family.name;document.getElementById('sideFamily').textContent=family.name;await loadAll();go(page)}
async function createFamily(){const name=document.getElementById('familyName').value.trim();if(!name)return toast('Masukkan nama keluarga.');const {data,error}=await sb.rpc('create_family',{p_name:name});if(error)return toast(error.message);toast('Keluarga berhasil dibuat');await loadMembership()}
async function joinFamily(){const code=document.getElementById('familyCode').value.trim().toUpperCase();if(!code)return toast('Masukkan kode keluarga.');const {data,error}=await sb.rpc('join_family',{p_code:code});if(error)return toast(error.message);toast('Berhasil bergabung');await loadMembership()}
async function loadAll(){const fid=family.id;let r=await sb.from('categories').select('*').eq('family_id',fid).order('name');categories=r.data||[];r=await sb.from('transactions').select('*').eq('family_id',fid).order('transaction_date',{ascending:false}).order('created_at',{ascending:false});transactions=r.data||[];r=await sb.from('budgets').select('*').eq('family_id',fid).order('month',{ascending:false});budgets=r.data||[];r=await sb.from('savings_goals').select('*').eq('family_id',fid).order('created_at');goals=r.data||[]}
function go(p){page=p;document.querySelectorAll('.nav button,.mobilebar button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent={dashboard:'Dashboard',transactions:'Transaksi',budgets:'Anggaran',savings:'Tabungan',reports:'Laporan',members:'Anggota',settings:'Pengaturan'}[p];render()}
function render(){if(page==='dashboard')renderDashboard();if(page==='transactions')renderTransactions();if(page==='budgets')renderBudgets();if(page==='savings')renderSavings();if(page==='reports')renderReports();if(page==='members')renderMembers();if(page==='settings')renderSettings()}
function monthTx(){const now=new Date(),m=now.getMonth(),y=now.getFullYear();return transactions.filter(t=>{const d=new Date(t.transaction_date);return d.getMonth()===m&&d.getFullYear()===y})}
function renderDashboard(){const tx=monthTx(),income=tx.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0),expense=tx.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0),balance=transactions.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0)-transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0);const recent=transactions.slice(0,8);document.getElementById('page').innerHTML=`<div class="grid"><div class="stat"><div class="label">Saldo keseluruhan</div><div class="value">${money(balance)}</div></div><div class="stat"><div class="label">Pemasukan bulan ini</div><div class="value income">${money(income)}</div></div><div class="stat"><div class="label">Pengeluaran bulan ini</div><div class="value expense">${money(expense)}</div></div><div class="stat"><div class="label">Sisa bulan ini</div><div class="value">${money(income-expense)}</div></div></div><div class="content"><div class="section"><div class="row"><h3>Transaksi terbaru</h3><button class="btn primary" onclick="openTx()">+ Transaksi</button></div>${recent.length?`<table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jumlah</th></tr></thead><tbody>${recent.map(t=>`<tr><td>${new Date(t.transaction_date).toLocaleDateString('id-ID')}</td><td>${esc(t.description)}</td><td>${esc(t.category_name||'-')}</td><td class="${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'-'} ${money(t.amount)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Belum ada transaksi.</div>'}</div><div class="section"><h3>Target tabungan</h3>${goals.length?goals.slice(0,5).map(g=>{const pct=Math.min(100,Number(g.target_amount)?Number(g.current_amount)/Number(g.target_amount)*100:0);return `<div style="margin:15px 0"><div class="row"><b>${esc(g.name)}</b><span>${Math.round(pct)}%</span></div><div class="chartbar"><span style="width:${pct}%"></span></div><div class="muted" style="font-size:12px;margin-top:5px">${money(g.current_amount)} / ${money(g.target_amount)}</div></div>`}).join(''):'<div class="empty">Belum ada target.</div>'}</div></div>`}
function renderTransactions(){document.getElementById('page').innerHTML=`<div class="section"><div class="row"><h3>Semua transaksi</h3><button class="btn primary" onclick="openTx()">+ Tambah</button></div><div style="overflow:auto"><table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Tipe</th><th>Jumlah</th><th></th></tr></thead><tbody>${transactions.length?transactions.map(t=>`<tr><td>${new Date(t.transaction_date).toLocaleDateString('id-ID')}</td><td>${esc(t.description)}</td><td>${esc(t.category_name||'-')}</td><td>${t.type==='income'?'Pemasukan':'Pengeluaran'}</td><td class="${t.type==='income'?'income':'expense'}">${money(t.amount)}</td><td><button class="btn ghost" onclick="delTx('${t.id}')">Hapus</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada transaksi.</td></tr>'}</tbody></table></div></div>`}
function openTx(){openModal('Tambah transaksi',`<div class="form"><div class="field"><label>Tipe</label><select id="txType"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></div><div class="field"><label>Jumlah</label><input id="txAmount" type="number" min="0" placeholder="50000"></div><div class="field"><label>Tanggal</label><input id="txDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Keterangan</label><input id="txDesc" placeholder="Belanja bulanan"></div><div class="field"><label>Kategori</label><select id="txCat">${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="saveTx()">Simpan transaksi</button></div>`)}
async function saveTx(){const amount=Number(document.getElementById('txAmount').value);if(!amount)return toast('Jumlah harus diisi.');const cid=document.getElementById('txCat').value||null;const cat=categories.find(c=>c.id===cid);const payload={family_id:family.id,user_id:user.id,type:document.getElementById('txType').value,amount,transaction_date:document.getElementById('txDate').value,description:document.getElementById('txDesc').value.trim(),category_id:cid,category_name:cat?.name||null};const {error}=await sb.from('transactions').insert(payload);if(error)return toast(error.message);closeModal();await loadAll();render();toast('Transaksi tersimpan')}
async function delTx(id){if(!confirm('Hapus transaksi ini?'))return;const {error}=await sb.from('transactions').delete().eq('id',id);if(error)return toast(error.message);await loadAll();render();toast('Transaksi dihapus')}
function renderBudgets(){const m=new Date().toISOString().slice(0,7),b=budgets.filter(x=>x.month===m);document.getElementById('page').innerHTML=`<div class="section"><div class="row"><h3>Anggaran ${m}</h3><button class="btn primary" onclick="openBudget()">+ Anggaran</button></div>${b.length?b.map(x=>{const spent=monthTx().filter(t=>t.type==='expense'&&t.category_id===x.category_id).reduce((a,t)=>a+Number(t.amount),0),pct=Math.min(100,spent/Number(x.amount)*100);return `<div style="margin:18px 0"><div class="row"><div><b>${esc(x.category_name)}</b><div class="muted" style="font-size:12px">Anggaran ${m}</div></div><div class="actions"><span>${money(spent)} / ${money(x.amount)}</span><button class="btn ghost" onclick="delBudget('${x.id}')">Hapus</button></div></div><div class="chartbar"><span style="width:${pct}%"></span></div></div>`}).join(''):'<div class="empty">Belum ada anggaran bulan ini.</div>'}</div>`}
async function delBudget(id){if(!confirm('Hapus anggaran ini?'))return;const {error}=await sb.from('budgets').delete().eq('id',id);if(error)return toast(error.message);await loadAll();render();toast('Anggaran dihapus')}
function openBudget(){openModal('Tambah anggaran',`<div class="form"><div class="field"><label>Kategori</label><select id="budgetCat">${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Jumlah anggaran</label><input id="budgetAmount" type="number" min="0"></div><button class="btn primary" onclick="saveBudget()">Simpan</button></div>`)}
async function saveBudget(){const cid=document.getElementById('budgetCat').value,amount=Number(document.getElementById('budgetAmount').value),cat=categories.find(c=>c.id===cid);if(!amount)return toast('Jumlah belum diisi.');const {error}=await sb.from('budgets').upsert({family_id:family.id,category_id:cid,category_name:cat.name,month:new Date().toISOString().slice(0,7),amount},{onConflict:'family_id,category_id,month'});if(error)return toast(error.message);closeModal();await loadAll();render();toast('Anggaran tersimpan')}
function renderSavings(){document.getElementById('page').innerHTML=`<div class="section"><div class="row"><h3>Target tabungan</h3><button class="btn primary" onclick="openGoal()">+ Target</button></div>${goals.length?goals.map(g=>{const pct=Math.min(100,Number(g.current_amount)/Number(g.target_amount)*100||0);return `<div style="padding:16px 0;border-bottom:1px solid #eee"><div class="row"><b>${esc(g.name)}</b><div class="actions"><button class="btn success" onclick="addGoal('${g.id}')">+ Setor</button><button class="btn ghost" onclick="delGoal('${g.id}')">Hapus</button></div></div><div class="chartbar" style="margin-top:10px"><span style="width:${pct}%"></span></div><div class="muted" style="margin-top:6px">${money(g.current_amount)} dari ${money(g.target_amount)} (${Math.round(pct)}%)</div></div>`}).join(''):'<div class="empty">Belum ada target tabungan.</div>'}</div>`}
async function delGoal(id){if(!confirm('Hapus target tabungan ini?'))return;const {error}=await sb.from('savings_goals').delete().eq('id',id);if(error)return toast(error.message);await loadAll();render();toast('Target tabungan dihapus')}
function openGoal(){openModal('Target tabungan',`<div class="form"><div class="field"><label>Nama target</label><input id="goalName" placeholder="Dana darurat"></div><div class="field"><label>Target nominal</label><input id="goalAmount" type="number"></div><button class="btn primary" onclick="saveGoal()">Simpan</button></div>`)}
async function saveGoal(){const name=document.getElementById('goalName').value.trim(),target=Number(document.getElementById('goalAmount').value);if(!name||!target)return toast('Lengkapi target.');const {error}=await sb.from('savings_goals').insert({family_id:family.id,name,target_amount:target,current_amount:0});if(error)return toast(error.message);closeModal();await loadAll();render()}
function addGoal(id){openModal('Tambah tabungan',`<div class="form"><div class="field"><label>Nominal setoran</label><input id="deposit" type="number"></div><button class="btn success" onclick="saveDeposit('${id}')">Tambah</button></div>`)}
async function saveDeposit(id){const n=Number(document.getElementById('deposit').value);const g=goals.find(x=>x.id===id);if(!n||!g)return toast('Nominal tidak valid.');const {error}=await sb.from('savings_goals').update({current_amount:Number(g.current_amount)+n}).eq('id',id);if(error)return toast(error.message);closeModal();await loadAll();render()}
function reportRange(type){const now=new Date(),start=new Date(now),end=new Date(now);if(type==='daily'){start.setHours(0,0,0,0);end.setHours(23,59,59,999)}else if(type==='weekly'){const day=(now.getDay()+6)%7;start.setDate(now.getDate()-day);start.setHours(0,0,0,0);end.setTime(start.getTime());end.setDate(start.getDate()+6);end.setHours(23,59,59,999)}else{start.setMonth(0,1);start.setHours(0,0,0,0);end.setMonth(11,31);end.setHours(23,59,59,999)}return {start,end}}
function renderReports(){const type=window.reportType||'daily',{start,end}=reportRange(type);const tx=transactions.filter(t=>{const d=new Date(t.transaction_date+'T00:00:00');return d>=start&&d<=end});const income=tx.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0),expense=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);const byCat={};tx.filter(t=>t.type==='expense').forEach(t=>{const k=t.category_name||'Tanpa kategori';byCat[k]=(byCat[k]||0)+Number(t.amount)});document.getElementById('page').innerHTML=`<div class="section"><div class="row"><div><h3>Laporan keuangan</h3><div class="muted">Ringkasan berdasarkan periode yang dipilih.</div></div><select onchange="window.reportType=this.value;renderReports()" style="padding:10px;border:1px solid #dbe2ea;border-radius:10px"><option value="daily" ${type==='daily'?'selected':''}>Harian</option><option value="weekly" ${type==='weekly'?'selected':''}>Mingguan</option><option value="yearly" ${type==='yearly'?'selected':''}>Tahunan</option></select></div><div class="grid" style="margin-top:18px"><div class="stat"><div class="label">Pemasukan</div><div class="value income">${money(income)}</div></div><div class="stat"><div class="label">Pengeluaran</div><div class="value expense">${money(expense)}</div></div><div class="stat"><div class="label">Selisih</div><div class="value">${money(income-expense)}</div></div><div class="stat"><div class="label">Transaksi</div><div class="value">${tx.length}</div></div></div><div style="margin-top:20px"><h3>Pengeluaran per kategori</h3>${Object.keys(byCat).length?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #eef2f7"><span>${esc(k)}</span><b class="expense">${money(v)}</b></div>`).join(''):'<div class="empty">Tidak ada pengeluaran pada periode ini.</div>'}</div><div style="margin-top:20px"><h3>Detail transaksi</h3>${tx.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Tipe</th><th>Jumlah</th></tr></thead><tbody>${tx.sort((a,b)=>new Date(b.transaction_date)-new Date(a.transaction_date)).map(t=>`<tr><td>${new Date(t.transaction_date).toLocaleDateString('id-ID')}</td><td>${esc(t.description)}</td><td>${t.type==='income'?'Pemasukan':'Pengeluaran'}</td><td class="${t.type==='income'?'income':'expense'}">${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada transaksi pada periode ini.</div>'}</div></div>`}
async function renderMembers(){const {data,error}=await sb.from('family_members').select('*,profiles(full_name,email)').eq('family_id',family.id);if(error)return document.getElementById('page').innerHTML=`<div class="section">${esc(error.message)}</div>`;document.getElementById('page').innerHTML=`<div class="section"><div class="row"><div><h3>Anggota keluarga</h3><div class="muted">Bagikan kode ini untuk mengundang anggota.</div></div><div class="code">${family.join_code}</div></div>${(data||[]).map(m=>`<div class="member"><div><b>${esc(m.profiles?.full_name||m.profiles?.email||'Anggota')}</b><div class="muted">${esc(m.profiles?.email||'')}</div></div><span class="badge">${m.role}</span></div>`).join('')}</div>`}
function renderSettings(){const name=profile?.full_name||user.user_metadata?.full_name||user.email||'';const avatarUrl=profile?.avatar_url||user.user_metadata?.avatar_url||'';document.getElementById('page').innerHTML=`<div class="section"><h3>Profil saya</h3><div class="profile-card"><div class="profile-avatar-lg" id="profileAvatar">${avatarUrl?`<img src="${esc(avatarUrl)}" alt="Foto profil">`:esc(name.charAt(0).toUpperCase())}</div><div><b style="font-size:18px">${esc(name)}</b><div class="muted">${esc(user.email||'')}</div><div class="profile-actions" style="margin-top:12px"><label class="btn primary" style="display:inline-block">📷 Ganti foto<input id="profilePhoto" type="file" accept="image/*" style="display:none" onchange="uploadProfilePhoto(event)"></label>${avatarUrl?`<button class="btn ghost" onclick="removeProfilePhoto()">Hapus foto</button>`:''}</div><div class="muted" style="font-size:12px;margin-top:8px">JPG, PNG, WEBP • Maks. 5 MB • Foto tersimpan di Supabase dan disinkronkan antar-perangkat</div></div></div><div class="field" style="max-width:500px"><label>Nama profil</label><input id="editProfileName" value="${esc(name)}"></div><button class="btn primary" style="margin-top:12px" onclick="saveProfile()">Simpan profil</button><hr style="border:0;border-top:1px solid #eee;margin:25px 0"><h3>Pengaturan keluarga</h3><div class="field" style="max-width:500px"><label>Nama keluarga</label><input id="editFamily" value="${esc(family.name)}"></div><button class="btn primary" style="margin-top:12px" onclick="saveFamily()">Simpan</button><hr style="border:0;border-top:1px solid #eee;margin:25px 0"><p><b>Email akun</b><br>${esc(user.email)}</p><p><b>Kode keluarga</b><br><span class="code">${family.join_code}</span></p></div>`}
function setHeaderAvatar(){const el=document.getElementById('avatar');const url=profile?.avatar_url||user?.user_metadata?.avatar_url;const name=profile?.full_name||user?.user_metadata?.full_name||user?.email||'A';el.innerHTML=url?`<img src="${esc(url)}" alt="Foto profil">`:esc(name.charAt(0).toUpperCase())}
async function saveProfile(){const name=document.getElementById('editProfileName').value.trim();if(!name)return toast('Nama profil belum diisi.');const {data,error}=await sb.auth.updateUser({data:{full_name:name}});if(error)return toast(error.message);user=data.user;profile={...profile,full_name:name};document.getElementById('userName').textContent=name;setHeaderAvatar();toast('Profil berhasil disimpan');renderSettings()}
async function ensureAvatarBucket(){
  // Bucket harus dibuat satu kali di Supabase Dashboard sebagai bucket PUBLIC bernama "avatars".
  // Fungsi ini hanya memberi pesan yang jelas jika bucket belum tersedia.
  const {data,error}=await sb.storage.listBuckets();
  if(error)return false;
  return (data||[]).some(b=>b.name==='avatars');
}
async function uploadProfilePhoto(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;if(file.size>5*1024*1024)return toast('Ukuran foto maksimal 5 MB.');if(!file.type.startsWith('image/'))return toast('File harus berupa gambar.');const bucketReady=await ensureAvatarBucket();if(!bucketReady)return toast('Bucket "avatars" belum dibuat di Supabase Storage.');toast('Mengunggah foto...');const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path=`${user.id}/profile.${ext}`;const bucket=sb.storage.from('avatars');await bucket.remove([`${user.id}/profile.jpg`,`${user.id}/profile.jpeg`,`${user.id}/profile.png`,`${user.id}/profile.webp`]);const {error:upError}=await bucket.upload(path,file,{upsert:true,contentType:file.type,cacheControl:'0'});if(upError)return toast('Upload gagal: '+upError.message);const {data}=bucket.getPublicUrl(path);const publicUrl=`${data.publicUrl}?v=${Date.now()}`;const {data:updateData,error:updateError}=await sb.auth.updateUser({data:{avatar_url:publicUrl}});if(updateError)return toast('Gagal menyimpan foto: '+updateError.message);const {error:profileError}=await sb.from('profiles').update({avatar_url:publicUrl}).eq('id',user.id);if(profileError)return toast('Foto sudah di-upload, tetapi gagal menyinkronkan profil: '+profileError.message);user=updateData.user;profile={...profile,avatar_url:publicUrl};setHeaderAvatar();toast('Foto profil berhasil diperbarui dan disinkronkan');renderSettings()}
async function removeProfilePhoto(){const bucketReady=await ensureAvatarBucket();if(bucketReady){await sb.storage.from('avatars').remove([`${user.id}/profile.jpg`,`${user.id}/profile.jpeg`,`${user.id}/profile.png`,`${user.id}/profile.webp`])}const {data,error}=await sb.auth.updateUser({data:{avatar_url:null}});if(error)return toast('Gagal menghapus foto: '+error.message);const {error:profileError}=await sb.from('profiles').update({avatar_url:null}).eq('id',user.id);if(profileError)return toast('Foto dihapus dari Storage, tetapi gagal menyinkronkan profil: '+profileError.message);user=data.user;profile={...profile,avatar_url:null};setHeaderAvatar();toast('Foto profil dihapus di semua perangkat');renderSettings()}
async function saveFamily(){const name=document.getElementById('editFamily').value.trim();if(!name)return;const {error}=await sb.from('families').update({name}).eq('id',family.id);if(error)return toast(error.message);family.name=name;document.getElementById('familyLabel').textContent=name;document.getElementById('sideFamily').textContent=name;toast('Disimpan')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')};function closeModal(){document.getElementById('modal').classList.add('hidden')}
// Tekan Enter pada keyboard PC/laptop atau tombol Enter/Go di keyboard HP
// saat berada di kolom Email atau Password untuk langsung menjalankan login.
document.getElementById('loginEmail').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    login();
  }
});

document.getElementById('loginPassword').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    e.preventDefault();
    login();
  }
});

init();
</script></body></html>
