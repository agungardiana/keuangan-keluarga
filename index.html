/* Responsive layout: cegah overflow dan teks terpotong di HP */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{min-width:0}
.main,.section,.card,.top,.userbox,.profile-card,.profile-card>div,.row,.field{min-width:0}
.top h1{overflow-wrap:anywhere}
.userbox{max-width:100%}
.userbox>div{min-width:0}
.userbox .muted,.profile-card .muted{overflow-wrap:anywhere;word-break:break-word}
.profile-card b{overflow-wrap:anywhere}
input,select{max-width:100%}

/* Toolbar mengambang: desktop di atas-tengah, navigasi kiri dan akun kanan */
@media(min-width:901px){
  .mobilebar{
    position:fixed; left:50%; right:auto; top:14px; bottom:auto;
    transform:translateX(-50%); width:max-content; max-width:calc(100% - 32px);
    display:flex; align-items:center; justify-content:flex-start;
    padding:6px 10px; border-radius:18px; gap:4px;
  }
  .mobilebar button{
    flex:0 0 auto; font-size:16px; padding:10px 12px;
  }
  .main{padding-top:88px}
  .top{display:flex; align-items:center; justify-content:flex-end; margin-bottom:20px}
  .top>div:first-child{display:none}
  .top .userbox{margin-left:auto; gap:10px; padding:5px 10px 5px 14px;
    border-radius:16px; background:var(--surface); box-shadow:0 4px 16px #1720330b}
  .top .userbox>div:nth-child(2){text-align:right}
}

@media(max-width:900px){
  .side{display:none}
  .main{margin:0;width:100%;max-width:100%;padding:16px 16px 110px;overflow:hidden}

  .top>div:first-child{min-width:0;flex:1}

  .row{align-items:flex-start;flex-wrap:wrap}
  .row>h3,.row>div:first-child{min-width:0}
  .actions{min-width:0}
  .profile-card{align-items:flex-start}

body{background:var(--bg);color:var(--text)}
.card,.section,.stat{background:var(--surface);color:var(--text)}
.muted{color:var(--muted)}

.table th,.table td{border-color:var(--border)}
.profile-card{background:var(--surface2);border-color:var(--border)}
.ghost{background:var(--soft);color:var(--text)}
.theme-options{display:grid;gap:10px;max-width:560px}
.theme-option{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);cursor:pointer}

body.theme-dark .tabs button{background:#263244;color:#cbd5e1}

body.theme-dark .chartbar{background:#334155}
body.theme-dark hr{border-color:#334155!important}
body.theme-mono{--bg:#dedede;--text:#171717;--surface:#e8e8e8;--surface2:#d9d9d9;--border:#b8b8b8;--muted:#444;--input:#dedede;--input-border:#999;--soft:#d0d0d0}

/* Transisi halus di seluruh aplikasi */
:root{scroll-behavior:smooth}
*,*::before,*::after{transition-property:background-color,color,border-color,box-shadow,opacity,transform,filter;transition-duration:220ms;transition-timing-function:cubic-bezier(.22,.61,.36,1)}
button,.btn,.nav button,.mobilebar button,.tabs button,.theme-option,.section,.stat,.card,.profile-card,.field input,.field select,.table tr,.badge,.avatar,.chartbar span{transition:background-color 220ms ease,color 220ms ease,border-color 220ms ease,box-shadow 260ms ease,transform 260ms cubic-bezier(.22,.61,.36,1),opacity 220ms ease}
button:hover,.btn:hover{transform:translateY(-1px)}
button:active,.btn:active{transform:translateY(0) scale(.985)}
#page.page-enter{animation:pageSoftEnter 320ms cubic-bezier(.22,.61,.36,1) both}
#page.page-exit{animation:pageSoftExit 150ms ease-in both;pointer-events:none}
@keyframes pageSoftEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes pageSoftExit{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-4px)}}
/* Animasi masuk/keluar diagram target tabungan */
.goal-pie-card{transform-origin:center;animation:goalChartEnter 520ms cubic-bezier(.16,1,.3,1) both}
.goal-pie-card:nth-child(2){animation-delay:45ms}.goal-pie-card:nth-child(3){animation-delay:90ms}.goal-pie-card:nth-child(4){animation-delay:135ms}.goal-pie-card:nth-child(5){animation-delay:180ms}.goal-pie-card:nth-child(6){animation-delay:225ms}.goal-pie-card:nth-child(7){animation-delay:270ms}.goal-pie-card:nth-child(8){animation-delay:315ms}
.goal-pie{animation:goalPieEnter 650ms cubic-bezier(.16,1,.3,1) both;transition:filter 260ms ease,transform 320ms cubic-bezier(.22,.61,.36,1)}
.goal-pie-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #17203312}
.goal-pie-card:hover .goal-pie{transform:rotate(-5deg) scale(1.04);filter:saturate(1.12)}
#page.page-exit .goal-pie-card{animation:goalChartExit 140ms ease-in both}
#page.page-exit .goal-pie{animation:goalPieExit 140ms ease-in both}
@keyframes goalChartEnter{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes goalPieEnter{from{opacity:0;transform:rotate(-35deg) scale(.65)}to{opacity:1;transform:rotate(0) scale(1)}}
@keyframes goalChartExit{to{opacity:0;transform:translateY(-8px) scale(.94)}}
@keyframes goalPieExit{to{opacity:0;transform:rotate(25deg) scale(.7)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* Diagram bulat dashboard */
/* Dashboard: panel target dibuat lebih lebar daripada panel pemasukan/pengeluaran */
.dashboard-charts{display:grid;grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr);gap:15px;margin-top:15px;align-items:stretch}
.dashboard-charts>.section{min-width:0}
.pie-wrap{position:relative;width:min(100%,220px);height:190px;margin:8px auto 0}
.pie-wrap canvas{width:100%!important;height:100%!important}
.chart-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:8px;font-size:13px;color:var(--muted)}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.goal-pies{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin-top:12px}
.goal-pie-card{border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center;min-width:0}
.goal-pie{width:104px;height:104px;border-radius:50%;margin:12px auto;display:grid;place-items:center;position:relative}
.goal-pie:before{content:"";position:absolute;inset:13px;border-radius:50%;background:var(--surface)}
.goal-pie span{position:relative;font-weight:800;font-size:15px}
.goal-pie-name{font-weight:700;overflow-wrap:anywhere}
.goal-pie-amount{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
@media(max-width:900px){.dashboard-charts{grid-template-columns:minmax(0,0.82fr) minmax(0,1.18fr)}}
@media(max-width:650px){.dashboard-charts{grid-template-columns:1fr}.pie-wrap{height:210px;width:min(100%,250px)}.goal-pies{grid-template-columns:repeat(2,minmax(0,1fr))}}

let sb=null,user=null,profile=null,membership=null,family=null,categories=[],transactions=[],budgets=[],goals=[]; let page='dashboard';

const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function showAuth(x){document.getElementById('loginForm').classList.toggle('hidden',x!=='login');document.getElementById('registerForm').classList.toggle('hidden',x!=='register')}
function setupTab(x){document.getElementById('createBox').classList.toggle('hidden',x!=='create');document.getElementById('joinBox').classList.toggle('hidden',x!=='join');document.getElementById('tabCreate').classList.toggle('active',x==='create');document.getElementById('tabJoin').classList.toggle('active',x==='join')}
async function init(){document.getElementById('today').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});if(!SUPABASE_URL||!SUPABASE_ANON_KEY){toast('Isi SUPABASE_URL dan SUPABASE_ANON_KEY di file index.html');return}sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const {data}=await sb.auth.getSession();if(data.session) await boot(data.session.user);sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_IN'&&s) await boot(s.user);if(e==='SIGNED_OUT') location.reload()})}
async function register(){const name=document.getElementById('regName').value.trim(),email=document.getElementById('regEmail').value.trim(),password=document.getElementById('regPassword').value;if(!name||!email||password.length<6)return toast('Lengkapi data. Password minimal 6 karakter.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name}}});if(error)return toast(error.message);if(!data.session)toast('Akun dibuat. Cek email untuk verifikasi, lalu masuk.');else await boot(data.user)}
let loginErrorTimer=null;function showLoginError(message='Email atau password salah'){const t=document.getElementById('loginErrorToast');if(!t)return;t.textContent=message;t.classList.remove('hide','show');void t.offsetWidth;t.classList.add('show');clearTimeout(loginErrorTimer);loginErrorTimer=setTimeout(()=>{t.classList.remove('show');t.classList.add('hide');setTimeout(()=>t.classList.remove('hide'),300)},2800)}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email||!password)return showLoginError('Email dan password wajib diisi');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return showLoginError('Email atau password salah');await boot(data.user)}
async function logout(){if(sb)await sb.auth.signOut()}
let bootPromise=null,bootUserId=null;async function boot(u){if(!u)return;if(bootPromise&&bootUserId===u.id)return bootPromise;bootUserId=u.id;bootPromise=(async()=>{user=u;document.getElementById('auth').classList.add('hidden');const {data:p,error}=await sb.from('profiles').select('*').eq('id',u.id).single();if(error){document.getElementById('auth').classList.remove('hidden');toast('Gagal membaca profil: '+error.message);return}profile=p;if(p?.avatar_url){user={...user,user_metadata:{...(user.user_metadata||{}),avatar_url:p.avatar_url}}}await loadMembership()})();try{return await bootPromise}finally{bootPromise=null}}
async function loadMembership(){const {data,error}=await sb.from('family_members').select('*,families(*)').eq('user_id',user.id).maybeSingle();if(error){toast('Gagal memuat data keluarga: '+error.message);return}if(!data){document.getElementById('setup').classList.remove('hidden');return}membership=data;family=data.families;if(!family){toast('Data keluarga tidak ditemukan. Silakan muat ulang atau periksa keanggotaan keluarga.');return}document.getElementById('setup').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('userName').textContent=profile.full_name||user.email;setHeaderAvatar();document.getElementById('familyLabel').textContent=family.name;document.getElementById('sideFamily').textContent=family.name;await loadAll();const pageEl=document.getElementById('page');if(!pageEl.innerHTML.trim()){page='dashboard';document.getElementById('pageTitle').textContent='Dashboard';document.querySelectorAll('.nav button,.mobilebar button').forEach(b=>b.classList.toggle('active',b.dataset.page==='dashboard'));render()}else{go(page)}}
async function createFamily(){const name=document.getElementById('familyName').value.trim();if(!name)return toast('Masukkan nama keluarga.');const {data,error}=await sb.rpc('create_family',{p_name:name});if(error)return toast(error.message);toast('Keluarga berhasil dibuat');await loadMembership()}
async function joinFamily(){const code=document.getElementById('familyCode').value.trim().toUpperCase();if(!code)return toast('Masukkan kode keluarga.');const {data,error}=await sb.rpc('join_family',{p_code:code});if(error)return toast(error.message);toast('Berhasil bergabung');await loadMembership()}
async function loadAll(){const fid=family.id;let r=await sb.from('categories').select('*').eq('family_id',fid).order('name');categories=r.data||[];r=await sb.from('transactions').select('*').eq('family_id',fid).order('transaction_date',{ascending:false}).order('created_at',{ascending:false});transactions=r.data||[];r=await sb.from('budgets').select('*').eq('family_id',fid).order('month',{ascending:false});budgets=r.data||[];r=await sb.from('savings_goals').select('*').eq('family_id',fid).order('created_at');goals=r.data||[]}
let pageTransitionTimer=null;
function go(p){const pageEl=document.getElementById('page');if(p===page&&!pageEl.classList.contains('page-exit')){if(!pageEl.innerHTML.trim()){document.getElementById('pageTitle').textContent={dashboard:'Dashboard',transactions:'Transaksi',budgets:'Anggaran',savings:'Tabungan',reports:'Laporan',members:'Anggota',settings:'Pengaturan'}[p]||'Dashboard';render()}return}pageEl.classList.remove('page-enter');pageEl.classList.add('page-exit');document.querySelectorAll('.nav button,.mobilebar button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));clearTimeout(pageTransitionTimer);pageTransitionTimer=setTimeout(()=>{page=p;document.getElementById('pageTitle').textContent={dashboard:'Dashboard',transactions:'Transaksi',budgets:'Anggaran',savings:'Tabungan',reports:'Laporan',members:'Anggota',settings:'Pengaturan'}[p]||'Dashboard';render()},150)}
function render(){const pageEl=document.getElementById('page');pageEl.classList.remove('page-exit','page-enter');if(page==='dashboard')renderDashboard();if(page==='transactions')renderTransactions();if(page==='budgets')renderBudgets();if(page==='savings')renderSavings();if(page==='reports')renderReports();if(page==='members')renderMembers();if(page==='settings')renderSettings();requestAnimationFrame(()=>{pageEl.classList.add('page-enter')})}
function monthTx(){const now=new Date(),m=now.getMonth(),y=now.getFullYear();return transactions.filter(t=>{const d=new Date(t.transaction_date);return d.getMonth()===m&&d.getFullYear()===y})}
function renderDashboard(){
  const tx=monthTx(),
    income=tx.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0),
    expense=tx.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0),
    balance=transactions.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0)-transactions.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0),
    recent=transactions.slice(0,8);
  document.getElementById('page').innerHTML=`
    <div class="grid">
      <div class="stat"><div class="label">Saldo keseluruhan</div><div class="value">${money(balance)}</div></div>
      <div class="stat"><div class="label">Pemasukan bulan ini</div><div class="value income">${money(income)}</div></div>
      <div class="stat"><div class="label">Pengeluaran bulan ini</div><div class="value expense">${money(expense)}</div></div>
      <div class="stat"><div class="label">Sisa bulan ini</div><div class="value">${money(income-expense)}</div></div>
    </div>
    <div class="dashboard-charts">
      <div class="section">
        <h3>Diagram pemasukan &amp; pengeluaran</h3>
        <div class="muted">Perbandingan nominal bulan ini</div>
        <div class="pie-wrap"><canvas id="incomeExpenseChart" aria-label="Diagram bulat pemasukan dan pengeluaran"></canvas></div>
        <div class="chart-legend"><span><i class="legend-dot" style="background:#059669"></i>Pemasukan: ${money(income)}</span><span><i class="legend-dot" style="background:#dc2626"></i>Pengeluaran: ${money(expense)}</span></div>
      </div>
      <div class="section">
        <h3>Diagram bulat target tabungan</h3>
        <div class="muted">Persentase progres setiap target</div>
        ${goals.length?`<div class="goal-pies">${goals.slice(0,8).map(g=>{
          const target=Number(g.target_amount)||0, current=Number(g.current_amount)||0;
          const pct=target>0?Math.min(100,Math.max(0,current/target*100)):0;
          return `<div class="goal-pie-card"><div class="goal-pie-name">${esc(g.name)}</div><div class="goal-pie" style="background:conic-gradient(#2563eb ${pct}%,var(--border) ${pct}% 100%)"><span>${Math.round(pct)}%</span></div><div class="goal-pie-amount">${money(current)}<br>dari ${money(target)}</div></div>`;
        }).join('')}</div>`:'<div class="empty">Belum ada target tabungan.</div>'}
      </div>
    </div>
    <div class="content">
      <div class="section"><div class="row"><h3>Transaksi terbaru</h3><button class="btn primary" onclick="openTx()">+ Transaksi</button></div>
        ${recent.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Jumlah</th></tr></thead><tbody>${recent.map(t=>`<tr><td>${new Date(t.transaction_date+'T00:00:00').toLocaleDateString('id-ID')}</td><td>${esc(t.description)}</td><td>${esc(t.category_name||'-')}</td><td class="${t.type==='income'?'income':'expense'}">${t.type==='income'?'+':'-'} ${money(t.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada transaksi.</div>'}
      </div>
    </div>`;
  const canvas=document.getElementById('incomeExpenseChart');
  if(canvas && typeof Chart!=='undefined'){
    if(window.incomeExpenseChartInstance) window.incomeExpenseChartInstance.destroy();
    const noData=income===0&&expense===0;
    window.incomeExpenseChartInstance=new Chart(canvas,{
      type:'pie',
      data:{labels:noData?['Belum ada transaksi']:['Pemasukan','Pengeluaran'],
        datasets:[{data:noData?[1]:[income,expense],backgroundColor:noData?['#cbd5e1']:['#059669','#dc2626'],borderColor:getComputedStyle(document.body).getPropertyValue('--surface').trim()||'#fff',borderWidth:2}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:getComputedStyle(document.body).getPropertyValue('--text').trim()||'#172033'}},tooltip:{callbacks:{label:ctx=>noData?'Belum ada transaksi':`${ctx.label}: ${money(ctx.raw)}`}}}}
    });
  }
}
function renderTransactions(){
 document.getElementById('page').innerHTML=`<div class="section">
 <div class="row"><div><h3>Semua transaksi</h3><div class="muted">Cari, saring, dan ekspor catatan keuangan.</div></div><button class="btn primary" onclick="openTx()">+ Tambah</button></div>
 <div class="transaction-toolbar"><input id="txSearch" placeholder="Cari keterangan/kategori..." oninput="filterTransactions()">
 <select id="txFilterType" onchange="filterTransactions()"><option value="all">Semua tipe</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select>
 <input id="txFilterMonth" type="month" value="${new Date().toISOString().slice(0,7)}" onchange="filterTransactions()">
 <button class="btn ghost" onclick="clearTransactionFilters()">Reset filter</button>
 <button class="btn success" onclick="exportTransactionsCSV()">Ekspor CSV</button>
 <button class="btn ghost" onclick="printFinanceReport()">Cetak / PDF</button></div>
 <div id="transactionResults"></div></div>`;
 filterTransactions();
}
function filteredTransactions(){
 const q=(document.getElementById('txSearch')?.value||'').trim().toLowerCase();
 const type=document.getElementById('txFilterType')?.value||'all';
 const month=document.getElementById('txFilterMonth')?.value||'';
 return transactions.filter(t=>(type==='all'||t.type===type)&&(!month||String(t.transaction_date||'').startsWith(month))&&(`${t.description||''} ${t.category_name||''}`.toLowerCase().includes(q)));
}
function filterTransactions(){
 const el=document.getElementById('transactionResults');if(!el)return;
 const list=filteredTransactions();
 el.innerHTML=list.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Tipe</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${list.map(t=>`<tr><td>${new Date(t.transaction_date+'T00:00:00').toLocaleDateString('id-ID')}</td><td>${esc(t.description||'-')}</td><td>${esc(t.category_name||'-')}</td><td>${t.type==='income'?'Pemasukan':'Pengeluaran'}</td><td class="${t.type==='income'?'income':'expense'}">${money(t.amount)}</td><td><div class="actions"><button class="btn ghost" onclick="editTx('${t.id}')">Edit</button><button class="btn ghost" onclick="delTx('${t.id}')">Hapus</button></div></td></tr>`).join('')}</tbody></table></div><div class="muted" style="margin-top:10px">${list.length} transaksi ditampilkan</div>`:'<div class="empty">Tidak ada transaksi yang cocok dengan filter.</div>';
}
function clearTransactionFilters(){document.getElementById('txSearch').value='';document.getElementById('txFilterType').value='all';document.getElementById('txFilterMonth').value='';filterTransactions()}
function exportTransactionsCSV(){
 const list=filteredTransactions();if(!list.length)return toast('Tidak ada transaksi untuk diekspor.');
 const rows=[['Tanggal','Keterangan','Kategori','Tipe','Jumlah (Rp)'],...list.map(t=>[t.transaction_date,t.description||'',t.category_name||'',t.type==='income'?'Pemasukan':'Pengeluaran',Number(t.amount)||0])];
 const csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='Transaksi_Keuangan.csv';a.click();URL.revokeObjectURL(url);toast('CSV berhasil diekspor');
}
function printFinanceReport(){window.print()}
function txFormMarkup(t={}){return `<div class="form"><div class="field"><label>Tipe</label><select id="txType"><option value="expense" ${t.type==='expense'?'selected':''}>Pengeluaran</option><option value="income" ${t.type==='income'?'selected':''}>Pemasukan</option></select></div><div class="field"><label>Jumlah</label><input id="txAmount" type="number" min="1" value="${t.amount??''}" placeholder="50000" required></div><div class="field"><label>Tanggal</label><input id="txDate" type="date" value="${t.transaction_date||new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Keterangan</label><input id="txDesc" value="${esc(t.description||'')}" placeholder="Belanja bulanan"></div><div class="field"><label>Kategori</label><select id="txCat"><option value="">Tanpa kategori</option>${categories.map(c=>`<option value="${c.id}" ${t.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><button class="btn primary" onclick="saveTx('${t.id||''}')">${t.id?'Simpan perubahan':'Simpan transaksi'}</button></div>`}
function openTx(){openModal('Tambah transaksi',txFormMarkup())}
function editTx(id){const t=transactions.find(x=>x.id===id);if(!t)return toast('Transaksi tidak ditemukan.');openModal('Edit transaksi',txFormMarkup(t))}
async function saveTx(id=''){const amount=Number(document.getElementById('txAmount').value),date=document.getElementById('txDate').value;if(!amount||amount<0||!date)return toast('Isi jumlah dan tanggal transaksi dengan benar.');const cid=document.getElementById('txCat').value||null;const cat=categories.find(c=>c.id===cid);const payload={family_id:family.id,user_id:user.id,type:document.getElementById('txType').value,amount,transaction_date:date,description:document.getElementById('txDesc').value.trim(),category_id:cid,category_name:cat?.name||null};const {error}=id?await sb.from('transactions').update(payload).eq('id',id).eq('family_id',family.id):await sb.from('transactions').insert(payload);if(error)return toast(error.message);closeModal();await loadAll();render();toast(id?'Transaksi berhasil diperbarui':'Transaksi tersimpan');if(!id){try{const {error:mailError}=await sb.functions.invoke('transaction-email',{body:{transaction:{...payload,category_name:cat?.name||null},family_name:family?.name||'Keluarga',recipient_email:user.email}});if(mailError){console.warn('Email transaksi gagal dikirim:',mailError);toast('Transaksi tersimpan, tetapi email notifikasi gagal. Periksa konfigurasi email.')}else{toast('Notifikasi transaksi dikirim ke email')}}catch(mailErr){console.warn(mailErr);toast('Transaksi tersimpan, tetapi notifikasi email belum tersedia.')}}}
async function delTx(id){if(!confirm('PERINGATAN: Hapus transaksi ini secara permanen? Data yang dihapus tidak dapat dipulihkan.'))return;const {error}=await sb.from('transactions').delete().eq('id',id);if(error)return toast(error.message);await loadAll();render();toast('Transaksi dihapus')}
function renderBudgets(){const m=new Date().toISOString().slice(0,7),b=budgets.filter(x=>x.month===m);document.getElementById('page').innerHTML=`<div class="section"><div class="row"><h3>Anggaran ${m}</h3><button class="btn primary" onclick="openBudget()">+ Anggaran</button></div>${b.length?b.map(x=>{const spent=monthTx().filter(t=>t.type==='expense'&&t.category_id===x.category_id).reduce((a,t)=>a+Number(t.amount),0),pct=Math.min(100,spent/Number(x.amount)*100);return `<div style="margin:18px 0"><div class="row"><div><b>${esc(x.category_name)}</b><div class="muted" style="font-size:12px">Anggaran ${m}</div></div><div class="actions"><span>${money(spent)} / ${money(x.amount)}</span><button class="btn ghost" onclick="editBudget('${x.id}')">Edit</button><button class="btn ghost" onclick="delBudget('${x.id}')">Hapus</button></div></div><div class="chartbar"><span style="width:${pct}%"></span></div></div>`}).join(''):'<div class="empty">Belum ada anggaran bulan ini.</div>'}</div>`}
async function delBudget(id){if(!confirm('PERINGATAN: Hapus anggaran ini secara permanen? Data yang dihapus tidak dapat dipulihkan.'))return;const {error}=await sb.from('budgets').delete().eq('id',id);if(error)return toast(error.message);await loadAll();render();toast('Anggaran dihapus')}
function budgetFormMarkup(b={}){return `<div class="form"><div class="field"><label>Kategori</label><select id="budgetCat">${categories.map(c=>`<option value="${c.id}" ${b.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Bulan anggaran</label><input id="budgetMonth" type="month" value="${b.month||new Date().toISOString().slice(0,7)}" required></div><div class="field"><label>Jumlah anggaran</label><input id="budgetAmount" type="number" min="1" value="${b.amount??''}" required></div><button class="btn primary" onclick="saveBudget('${b.id||''}')">${b.id?'Simpan perubahan':'Simpan'}</button></div>`}
function openBudget(){openModal('Tambah anggaran',budgetFormMarkup())}
function editBudget(id){const b=budgets.find(x=>x.id===id);if(!b)return toast('Anggaran tidak ditemukan.');openModal('Edit anggaran',budgetFormMarkup(b))}
async function saveBudget(id=''){const cid=document.getElementById('budgetCat').value,amount=Number(document.getElementById('budgetAmount').value),month=document.getElementById('budgetMonth').value,cat=categories.find(c=>c.id===cid);if(!cid||!cat||!amount||amount<0||!month)return toast('Lengkapi kategori, bulan, dan jumlah anggaran.');const payload={family_id:family.id,category_id:cid,category_name:cat.name,month,amount};const {error}=id?await sb.from('budgets').update(payload).eq('id',id).eq('family_id',family.id):await sb.from('budgets').upsert(payload,{onConflict:'family_id,category_id,month'});if(error)return toast(error.message);closeModal();await loadAll();render();toast(id?'Anggaran berhasil diperbarui':'Anggaran tersimpan')}
function renderSavings(){document.getElementById('page').innerHTML=`<div class="section"><div class="row"><h3>Target tabungan</h3><button class="btn primary" onclick="openGoal()">+ Target</button></div>${goals.length?goals.map(g=>{const pct=Math.min(100,Number(g.current_amount)/Number(g.target_amount)*100||0);return `<div style="padding:16px 0;border-bottom:1px solid #eee"><div class="row"><b>${esc(g.name)}</b><div class="actions"><button class="btn success" onclick="addGoal('${g.id}')">+ Setor</button><button class="btn ghost" onclick="editGoal('${g.id}')">Edit</button><button class="btn ghost" onclick="delGoal('${g.id}')">Hapus</button></div></div><div class="chartbar" style="margin-top:10px"><span style="width:${pct}%"></span></div><div class="muted" style="margin-top:6px">${money(g.current_amount)} dari ${money(g.target_amount)} (${Math.round(pct)}%)</div></div>`}).join(''):'<div class="empty">Belum ada target tabungan.</div>'}</div>`}
async function delGoal(id){if(!confirm('PERINGATAN: Hapus target tabungan ini secara permanen? Data target yang dihapus tidak dapat dipulihkan.'))return;const {error}=await sb.from('savings_goals').delete().eq('id',id);if(error)return toast(error.message);await loadAll();render();toast('Target tabungan dihapus')}
function goalFormMarkup(g={}){return `<div class="form"><div class="field"><label>Nama target</label><input id="goalName" value="${esc(g.name||'')}" placeholder="Dana darurat" required></div><div class="field"><label>Target nominal</label><input id="goalAmount" type="number" min="1" value="${g.target_amount??''}" required></div><div class="field"><label>Tabungan terkumpul</label><input id="goalCurrent" type="number" min="0" value="${g.current_amount??0}" required></div><button class="btn primary" onclick="saveGoal('${g.id||''}')">${g.id?'Simpan perubahan':'Simpan'}</button></div>`}
function openGoal(){openModal('Tambah target tabungan',goalFormMarkup())}
function editGoal(id){const g=goals.find(x=>x.id===id);if(!g)return toast('Target tabungan tidak ditemukan.');openModal('Edit target tabungan',goalFormMarkup(g))}
async function saveGoal(id=''){const name=document.getElementById('goalName').value.trim(),target=Number(document.getElementById('goalAmount').value),current=Number(document.getElementById('goalCurrent').value);if(!name||!target||target<1||current<0||!Number.isFinite(current))return toast('Lengkapi nama dan nominal target dengan benar.');const payload={family_id:family.id,name,target_amount:target,current_amount:current};const {error}=id?await sb.from('savings_goals').update(payload).eq('id',id).eq('family_id',family.id):await sb.from('savings_goals').insert(payload);if(error)return toast(error.message);closeModal();await loadAll();render();toast(id?'Target tabungan berhasil diperbarui':'Target tabungan tersimpan')}
function addGoal(id){openModal('Tambah tabungan',`<div class="form"><div class="field"><label>Nominal setoran</label><input id="deposit" type="number"></div><button class="btn success" onclick="saveDeposit('${id}')">Tambah</button></div>`)}
async function saveDeposit(id){const n=Number(document.getElementById('deposit').value);const g=goals.find(x=>x.id===id);if(!n||!g)return toast('Nominal tidak valid.');const {error}=await sb.from('savings_goals').update({current_amount:Number(g.current_amount)+n}).eq('id',id);if(error)return toast(error.message);closeModal();await loadAll();render()}
function reportRange(type){const now=new Date(),start=new Date(now),end=new Date(now);if(type==='daily'){start.setHours(0,0,0,0);end.setHours(23,59,59,999)}else if(type==='weekly'){const day=(now.getDay()+6)%7;start.setDate(now.getDate()-day);start.setHours(0,0,0,0);end.setTime(start.getTime());end.setDate(start.getDate()+6);end.setHours(23,59,59,999)}else{start.setMonth(0,1);start.setHours(0,0,0,0);end.setMonth(11,31);end.setHours(23,59,59,999)}return {start,end}}
function getReportTransactions(type, selectedMonth){
  const now=new Date(); let start,end;
  if(type==='monthly'){
    const ym=selectedMonth||now.toISOString().slice(0,7), [y,m]=ym.split('-').map(Number);
    start=new Date(y,m-1,1,0,0,0,0); end=new Date(y,m,0,23,59,59,999);
  }else ({start,end}=reportRange(type));
  return transactions.filter(t=>{const d=new Date(t.transaction_date+'T00:00:00');return d>=start&&d<=end});
}
function exportMonthlyReport(){
  if(typeof XLSX==='undefined')return toast('Fitur Excel belum siap. Periksa koneksi internet.');
  const type=window.reportType||'monthly';
  const selected=type==='yearly'
    ? (document.getElementById('reportYear')?.value||String(new Date().getFullYear()))
    : (document.getElementById('reportMonth')?.value||new Date().toISOString().slice(0,7));

  let tx;
  let title;
  if(type==='yearly'){
    const y=Number(selected);
    tx=transactions.filter(t=>{
      const d=new Date(t.transaction_date+'T00:00:00');
      return d.getFullYear()===y;
    });
    title=`Laporan Tahunan ${y}`;
  }else{
    tx=getReportTransactions('monthly',selected);
    const [y,m]=selected.split('-').map(Number);
    title=`Laporan ${new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}`;
  }

  const income=tx.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
  const expense=tx.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);
  const balance=income-expense;

  const monthNames=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const monthly=[];
  if(type==='yearly'){
    const y=Number(selected);
    for(let m=0;m<12;m++){
      const mt=tx.filter(t=>{
        const d=new Date(t.transaction_date+'T00:00:00');
        return d.getFullYear()===y && d.getMonth()===m;
      });
      const mi=mt.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
      const me=mt.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);
      monthly.push({
        'Bulan':monthNames[m],
        'Pemasukan (Rp)':mi,
        'Pengeluaran (Rp)':me,
        'Selisih (Rp)':mi-me,
        'Jumlah Transaksi':mt.length
      });
    }
  }

  const byCat={};
  tx.forEach(t=>{
    const k=t.category_name||'Tanpa kategori';
    if(!byCat[k])byCat[k]={income:0,expense:0,count:0};
    if(t.type==='income')byCat[k].income+=Number(t.amount);
    else byCat[k].expense+=Number(t.amount);
    byCat[k].count++;
  });
  const categoriesSummary=Object.entries(byCat).map(([k,v])=>({
    'Kategori':k,
    'Pemasukan (Rp)':v.income,
    'Pengeluaran (Rp)':v.expense,
    'Selisih (Rp)':v.income-v.expense,
    'Jumlah Transaksi':v.count
  })).sort((a,b)=>b['Pengeluaran (Rp)']-a['Pengeluaran (Rp)']);

  const rows=tx.slice().sort((a,b)=>new Date(a.transaction_date)-new Date(b.transaction_date)).map((t,i)=>({
    'No':i+1,
    'Tanggal':new Date(t.transaction_date+'T00:00:00').toLocaleDateString('id-ID'),
    'Keterangan':t.description||'',
    'Kategori':t.category_name||'Tanpa kategori',
    'Tipe':t.type==='income'?'Pemasukan':'Pengeluaran',
    'Pemasukan (Rp)':t.type==='income'?Number(t.amount):0,
    'Pengeluaran (Rp)':t.type==='expense'?Number(t.amount):0
  }));

  // Running balance for the detailed sheet.
  let running=0;
  rows.forEach(r=>{
    running += Number(r['Pemasukan (Rp)'])-Number(r['Pengeluaran (Rp)']);
    r['Saldo Berjalan (Rp)']=running;
  });

  const summary=[
    {'Ringkasan':'Laporan Keuangan','Nilai':title},
    {'Ringkasan':'Nama Keluarga','Nilai':family?.name||''},
    {'Ringkasan':'Periode', 'Nilai':type==='yearly'?`1 Januari ${selected} - 31 Desember ${selected}`:title.replace('Laporan ','')},
    {'Ringkasan':'Total Pemasukan (Rp)','Nilai':income},
    {'Ringkasan':'Total Pengeluaran (Rp)','Nilai':expense},
    {'Ringkasan':'Selisih / Saldo Bersih (Rp)','Nilai':balance},
    {'Ringkasan':'Jumlah Transaksi','Nilai':tx.length}
  ];

  const wb=XLSX.utils.book_new();
  const wsSummary=XLSX.utils.json_to_sheet(summary);
  const wsCat=XLSX.utils.json_to_sheet(categoriesSummary);
  const wsTx=XLSX.utils.json_to_sheet(rows);

  [wsSummary,wsCat,wsTx].forEach(ws=>{
    ws['!autofilter']={ref:ws['!ref']};
    ws['!freeze']={xSplit:0,ySplit:1};
  });
  wsSummary['!cols']=[{wch:32},{wch:38}];
  wsCat['!cols']=[{wch:28},{wch:20},{wch:20},{wch:20},{wch:18}];
  wsTx['!cols']=[{wch:7},{wch:15},{wch:35},{wch:24},{wch:18},{wch:20},{wch:20},{wch:22}];

  // Currency formats.
  [wsSummary,wsCat,wsTx].forEach(ws=>{
    Object.keys(ws).forEach(addr=>{
      if(addr[0]==='!')return;
      const cell=ws[addr];
      if(typeof cell.v==='number' && /Rp/.test(String(ws[addr.replace(/\d+/,'1')]?.v||''))) cell.z='#,##0';
    });
  });

  XLSX.utils.book_append_sheet(wb,wsSummary,'Ringkasan');
  if(type==='yearly'){
    const wsMonthly=XLSX.utils.json_to_sheet(monthly);
    wsMonthly['!cols']=[{wch:18},{wch:20},{wch:20},{wch:20},{wch:18}];
    wsMonthly['!autofilter']={ref:wsMonthly['!ref']};
    wsMonthly['!freeze']={xSplit:0,ySplit:1};
    XLSX.utils.book_append_sheet(wb,wsMonthly,'Rekap Bulanan');
  }
  XLSX.utils.book_append_sheet(wb,wsCat,'Rekap Kategori');
  XLSX.utils.book_append_sheet(wb,wsTx,'Detail Transaksi');

  const filename=type==='yearly'
    ? `Laporan_Keuangan_Tahunan_${selected}.xlsx`
    : `Laporan_Keuangan_${selected}.xlsx`;
  XLSX.writeFile(wb,filename);
  toast('Laporan Excel berhasil dibuat');
}
function renderReports(){
  const type=window.reportType||'monthly';
  const selectedMonth=window.reportMonth||new Date().toISOString().slice(0,7);
  const selectedYear=window.reportYear||String(new Date().getFullYear());

  let tx;
  if(type==='yearly'){
    const y=Number(selectedYear);
    tx=transactions.filter(t=>{
      const d=new Date(t.transaction_date+'T00:00:00');
      return d.getFullYear()===y;
    });
  }else{
    tx=getReportTransactions(type,selectedMonth);
  }

  const income=tx.filter(t=>t.type==='income').reduce((a,b)=>a+Number(b.amount),0);
  const expense=tx.filter(t=>t.type==='expense').reduce((a,b)=>a+Number(b.amount),0);

  const byCat={};
  tx.filter(t=>t.type==='expense').forEach(t=>{
    const k=t.category_name||'Tanpa kategori';
    byCat[k]=(byCat[k]||0)+Number(t.amount);
  });

  let periodLabel='';
  if(type==='monthly'){
    periodLabel=new Date(selectedMonth+'-01T00:00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  }else if(type==='yearly'){
    periodLabel=`Tahun ${selectedYear}`;
  }else{
    periodLabel=type==='daily'?'Hari ini':'Minggu ini';
  }

  const years=[...new Set(transactions.map(t=>new Date(t.transaction_date+'T00:00:00').getFullYear()))]
    .filter(Boolean).sort((a,b)=>b-a);
  if(!years.includes(Number(selectedYear)))years.unshift(Number(selectedYear));

  document.getElementById('page').innerHTML=`
  <div class="section">
    <div class="row">
      <div>
        <h3>Laporan keuangan</h3>
        <div class="muted">Ringkasan dan detail berdasarkan periode yang dipilih.</div>
      </div>
      <div class="actions">
        <select onchange="window.reportType=this.value;renderReports()" style="padding:10px;border:1px solid var(--input-border);border-radius:10px;background:var(--input);color:var(--text)">
          <option value="monthly" ${type==='monthly'?'selected':''}>Bulanan</option>
          <option value="daily" ${type==='daily'?'selected':''}>Harian</option>
          <option value="weekly" ${type==='weekly'?'selected':''}>Mingguan</option>
          <option value="yearly" ${type==='yearly'?'selected':''}>Tahunan</option>
        </select>
        ${type==='monthly'?`
          <input id="reportMonth" type="month" value="${selectedMonth}" onchange="window.reportMonth=this.value;renderReports()" style="padding:10px;border:1px solid var(--input-border);border-radius:10px;background:var(--input);color:var(--text)">
          <button class="btn success" onclick="exportMonthlyReport()">📊 Export Excel</button>
        `:''}
        ${type==='yearly'?`
          <select id="reportYear" onchange="window.reportYear=this.value;renderReports()" style="padding:10px;border:1px solid var(--input-border);border-radius:10px;background:var(--input);color:var(--text)">
            ${years.map(y=>`<option value="${y}" ${String(y)===String(selectedYear)?'selected':''}>${y}</option>`).join('')}
          </select>
          <button class="btn success" onclick="exportMonthlyReport()">📊 Export Excel Tahunan</button>
        `:''}
      </div>
    </div>

    <div class="muted" style="margin-top:10px">Periode: <b>${esc(periodLabel)}</b></div>

    <div class="grid" style="margin-top:18px">
      <div class="stat"><div class="label">Pemasukan</div><div class="value income">${money(income)}</div></div>
      <div class="stat"><div class="label">Pengeluaran</div><div class="value expense">${money(expense)}</div></div>
      <div class="stat"><div class="label">Selisih</div><div class="value">${money(income-expense)}</div></div>
      <div class="stat"><div class="label">Transaksi</div><div class="value">${tx.length}</div></div>
    </div>

    ${type==='yearly'?`
    <div style="margin-top:25px">
      <h3>Rekap bulanan ${esc(selectedYear)}</h3>
      <div style="overflow:auto">
        <table class="table">
          <thead><tr><th>Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th><th>Transaksi</th></tr></thead>
          <tbody>
            ${Array.from({length:12},(_,m)=>{
              const mt=tx.filter(t=>new Date(t.transaction_date+'T00:00:00').getMonth()===m);
              const mi=mt.filter(t=>t.type==='income').reduce((a,t)=>a+Number(t.amount),0);
              const me=mt.filter(t=>t.type==='expense').reduce((a,t)=>a+Number(t.amount),0);
              return `<tr><td>${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][m]}</td><td class="income">${money(mi)}</td><td class="expense">${money(me)}</td><td>${money(mi-me)}</td><td>${mt.length}</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`:''}

    <div style="margin-top:25px">
      <h3>Pengeluaran per kategori</h3>
      ${Object.keys(byCat).length
        ?Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--border)"><span>${esc(k)}</span><b class="expense">${money(v)}</b></div>`).join('')
        :'<div class="empty">Tidak ada pengeluaran pada periode ini.</div>'}
    </div>

    <div style="margin-top:25px">
      <h3>Detail transaksi</h3>
      ${tx.length?`
        <div style="overflow:auto">
          <table class="table">
            <thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Tipe</th><th>Jumlah</th></tr></thead>
            <tbody>
              ${tx.slice().sort((a,b)=>new Date(b.transaction_date)-new Date(a.transaction_date)).map(t=>`
                <tr>
                  <td>${new Date(t.transaction_date+'T00:00:00').toLocaleDateString('id-ID')}</td>
                  <td>${esc(t.description)}</td>
                  <td>${esc(t.category_name||'-')}</td>
                  <td>${t.type==='income'?'Pemasukan':'Pengeluaran'}</td>
                  <td class="${t.type==='income'?'income':'expense'}">${money(t.amount)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`
        :'<div class="empty">Tidak ada transaksi pada periode ini.</div>'}
    </div>
  </div>`;
}

function renderSettings(){
  const name=profile?.full_name||user.user_metadata?.full_name||user.email||'',avatarUrl=profile?.avatar_url||user.user_metadata?.avatar_url||'',theme=getTheme();
  document.getElementById('page').innerHTML=`<div class="section"><h3>Profil saya</h3><div class="profile-card"><div class="profile-avatar-lg" id="profileAvatar">${avatarUrl?`<img src="${esc(avatarUrl)}" alt="Foto profil">`:esc(name.charAt(0).toUpperCase())}</div><div><b style="font-size:18px">${esc(name)}</b><div class="muted">${esc(user.email||'')}</div><div class="profile-actions" style="margin-top:12px"><label class="btn primary" style="display:inline-block">📷 Ganti foto<input id="profilePhoto" type="file" accept="image/*" style="display:none" onchange="uploadProfilePhoto(event)"></label>${avatarUrl?`<button class="btn ghost" onclick="removeProfilePhoto()">Hapus foto</button>`:''}</div><div class="muted" style="font-size:12px;margin-top:8px">JPG, PNG, WEBP • Maks. 5 MB • Foto tersimpan di Supabase dan disinkronkan antar-perangkat</div></div></div><div class="field" style="max-width:500px"><label>Nama profil</label><input id="editProfileName" value="${esc(name)}"></div><button class="btn primary" style="margin-top:12px" onclick="saveProfile()">Simpan profil</button><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><h3>Tema tampilan</h3><div class="muted" style="margin-bottom:12px">Pilih tampilan aplikasi. Tema tersimpan di perangkat ini.</div><div class="theme-options"><label class="theme-option"><input type="radio" name="theme" value="default" ${theme==='default'?'checked':''} onchange="setTheme('default')"><span><b>Mode Default</b><br><span class="muted">Tampilan terang standar aplikasi.</span></span><span>☀️</span></label><label class="theme-option"><input type="radio" name="theme" value="dark" ${theme==='dark'?'checked':''} onchange="setTheme('dark')"><span><b>Mode Gelap</b><br><span class="muted">Latar gelap dengan teks dan elemen yang disesuaikan agar tetap jelas.</span></span><span>🌙</span></label><label class="theme-option"><input type="radio" name="theme" value="mono" ${theme==='mono'?'checked':''} onchange="setTheme('mono')"><span><b>Mode Monocrom</b><br><span class="muted">Tampilan hitam putih/grayscale.</span></span><span>⚫⚪</span></label></div><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><h3>Pengaturan keluarga</h3><div class="field" style="max-width:500px"><label>Nama keluarga</label><input id="editFamily" value="${esc(family.name)}"></div><button class="btn primary" style="margin-top:12px" onclick="saveFamily()">Simpan</button><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><h3>Anggota keluarga</h3><div class="muted" style="margin-bottom:12px">Kelola dan lihat anggota keluarga dari sini.</div><button class="btn ghost" onclick="go('members')">👨‍👩‍👧 Lihat anggota keluarga</button><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><p><b>Email akun</b><br>${esc(user.email)}</p><p><b>Kode keluarga</b><br><span class="code">${family.join_code}</span></p><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><button class="btn danger" onclick="logout()">🚪 Keluar</button></div>`;

function setHeaderAvatar(){const el=document.getElementById('avatar');const url=profile?.avatar_url||user?.user_metadata?.avatar_url;const name=profile?.full_name||user?.user_metadata?.full_name||user?.email||'A';el.innerHTML=url?`<img src="${esc(url)}" alt="Foto profil">`:esc(name.charAt(0).toUpperCase())}
async function saveProfile(){const name=document.getElementById('editProfileName').value.trim();if(!name)return toast('Nama profil belum diisi.');const {data,error}=await sb.auth.updateUser({data:{full_name:name}});if(error)return toast(error.message);user=data.user;profile={...profile,full_name:name};document.getElementById('userName').textContent=name;setHeaderAvatar();toast('Profil berhasil disimpan');renderSettings()}
async function uploadProfilePhoto(event){
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  if(file.size>5*1024*1024)return toast('Ukuran foto maksimal 5 MB.');
  if(!file.type.startsWith('image/'))return toast('File harus berupa gambar.');
  if(!user?.id)return toast('Sesi login tidak ditemukan. Silakan masuk kembali.');
  toast('Mengunggah foto...');
  const allowedExt={ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif' };
  const ext=allowedExt[file.type];if(!ext)return toast('Format foto harus JPG, PNG, WEBP, atau GIF.');
  const path=`${user.id}/profile.${ext}`;const bucket=sb.storage.from('avatars');
  // Upload dulu agar foto lama tidak hilang jika upload baru gagal.
  const {error:upError}=await bucket.upload(path,file,{upsert:true,contentType:file.type,cacheControl:'0'});
  if(upError)return toast('Upload gagal: '+upError.message+'. Pastikan bucket avatars tersedia dan policy SQL sudah dijalankan.');
  const {data}=bucket.getPublicUrl(path);const publicUrl=data.publicUrl+'?v='+Date.now();
  const {data:updateData,error:updateError}=await sb.auth.updateUser({data:{avatar_url:publicUrl}});
  if(updateError)return toast('Foto terunggah, tetapi gagal menyimpan profil: '+updateError.message);
  // Simpan URL di metadata Auth agar tidak bergantung pada kolom profiles.avatar_url.
  user=updateData.user;profile={...profile,avatar_url:publicUrl};
  const oldPaths=['jpg','jpeg','png','webp','gif'].filter(x=>x!==ext).map(x=>`${user.id}/profile.${x}`);
  const {error:removeError}=await bucket.remove(oldPaths);if(removeError)console.warn('Foto lama belum terhapus:',removeError.message);
  setHeaderAvatar();toast('Foto profil berhasil diperbarui dan disinkronkan');renderSettings();
}
async function removeProfilePhoto(){
  if(!confirm('PERINGATAN: Hapus foto profil dari akun dan penyimpanan? Foto tidak dapat dipulihkan setelah dihapus.'))return;
  if(!user?.id)return toast('Sesi login tidak ditemukan. Silakan masuk kembali.');
  const {data,error}=await sb.auth.updateUser({data:{avatar_url:null}});
  if(error)return toast('Gagal menghapus foto profil: '+error.message);
  const paths=['jpg','jpeg','png','webp','gif'].map(x=>`${user.id}/profile.${x}`);
  const {error:storageError}=await sb.storage.from('avatars').remove(paths);
  user=data.user;profile={...profile,avatar_url:null};setHeaderAvatar();renderSettings();
  if(storageError)toast('Foto dihapus dari profil, tetapi file Storage belum terhapus: '+storageError.message);else toast('Foto profil berhasil dihapus');
}
